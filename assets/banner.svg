<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Guilherme Anselmo // Data Science &amp; AI</title>
  <desc id="desc">An amber mission-control HUD inside a dark cavern, with original teal morkite, red nitra and gold crystals. Rock and Stone!</desc>
  <defs>
    <linearGradient id="cave" x2="1" y2="1">
      <stop stop-color="#100E0B"/>
      <stop offset="1" stop-color="#2B1D13"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#261C13"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <radialGradient id="mineral-light">
      <stop stop-color="#49C9B4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#49C9B4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hazard" width="14" height="12" patternUnits="userSpaceOnUse">
      <path d="M-7 12 5 0M7 12 19 0" stroke="#FFB000" stroke-width="5"/>
